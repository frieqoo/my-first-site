<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一个 Cloudflare Pages 网站</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: 80px auto;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      color: #2563eb;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      background: #e0edff;
      color: #1d4ed8;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>你好，这是我的第一个网站！</h1>
    <p>这个网页部署在 Cloudflare Pages 上。</p>
    <p>以后我可以在这里放个人主页、学习笔记、项目展示、导航页。</p>
    <div class="tag">Made by 赵俊喆</div>
  </div>
</body>
</html>
